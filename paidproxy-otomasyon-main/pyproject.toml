[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-pipeline"
version = "0.1.0"
description = "Autonomous proxy discovery and validation pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "anyio>=4.0",
    "zstandard>=0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pipeline = "proxy_pipeline.cli.main:main"
proxy-pipeline = "proxy_pipeline.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
