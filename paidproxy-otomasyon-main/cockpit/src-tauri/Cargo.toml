[package]
name = "paidproxy-cockpit"
version = "2.0.0"
description = "PaidProxy Operasyon Kokpiti"
authors = ["PaidProxy"]
edition = "2021"

[lib]
name = "paidproxy_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
